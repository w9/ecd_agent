<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Feasibility — local chat</title>
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #1b2430;
      --muted: #5d6b7a;
      --line: #d5dde5;
      --accent: #0e6b6b;
      --user: #143447;
      --danger: #9b2c2c;
      --danger-bg: #fdecec;
      --shadow: 0 10px 30px rgba(20, 32, 48, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .shell {
      width: min(820px, 100%);
      height: min(900px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    #thread {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty {
      margin: auto;
      max-width: 440px;
      text-align: center;
      color: var(--muted);
    }

    .empty h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }

    .samples {
      margin: 0;
      border: 0;
      border-top: 1px solid var(--line);
      background: #f6f8fa;
      padding: 10px 16px 12px;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(220px, 2fr);
      gap: 8px 10px;
    }

    .samples legend {
      padding: 8px 0 0;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .samples label {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      min-width: 0;
      font-size: 11px;
      color: var(--muted);
    }

    .samples select {
      width: 100%;
    }

    @media (max-width: 640px) {
      .samples { grid-template-columns: 1fr; }
    }

    .msg {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: #fff;
    }

    .msg.user .nct {
      display: block;
      margin-top: 6px;
      opacity: 0.75;
      font-size: 12px;
    }

    .msg.assistant, .msg.error, .msg.pending {
      align-self: flex-start;
      background: #f6f8fa;
      border: 1px solid var(--line);
    }

    .msg.error {
      background: var(--danger-bg);
      border-color: #f0c2c2;
      color: var(--danger);
    }

    .msg.pending { color: var(--muted); font-style: italic; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .badge, .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge { background: #dce8e8; color: #0b4f4f; }
    .badge.route-site { background: #d9efe4; color: #0d7a4f; }
    .badge.route-protocol { background: #dce6f5; color: #1f4e79; }
    .badge.route-hybrid { background: #eadcf5; color: #6b3fa0; }
    .badge.route-reject { background: #f5ebd2; color: #9a6700; }
    .chip {
      text-transform: none;
      font-weight: 500;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px 16px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
    }

    .composer label {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    select, textarea, button.send {
      font: inherit;
    }

    select {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      resize: none;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
    }

    textarea:focus, select:focus {
      outline: 2px solid #b7d8d8;
      border-color: var(--accent);
    }

    button.send {
      align-self: end;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      cursor: pointer;
    }

    button.send:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .debug-list {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .debug-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f6f8fa;
      overflow: hidden;
    }

    .debug-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    button.copy {
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    button.copy:hover { border-color: var(--accent); color: var(--accent); }

    .debug-card pre {
      margin: 0;
      max-height: 240px;
      overflow: auto;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Clinical site feasibility</h1>
      <p>Local one-shot UI for <code>POST /query</code>. History is not kept.</p>
    </header>
    <div id="thread"></div>
    <fieldset class="samples">
      <legend>Sample questions</legend>
      <label>
        Category
        <select id="sample-category">
          <option value="">Select a category…</option>
        </select>
      </label>
      <label>
        Question
        <select id="sample-question" disabled>
          <option value="">Select a sample…</option>
        </select>
      </label>
    </fieldset>
    <form class="composer" id="form">
      <label>
        Attached protocol
        <select id="nct" name="nct_id">
          <option value="">None</option>
        </select>
      </label>
      <textarea id="query" name="query" rows="2" required maxlength="8000"
        placeholder="Ask about a site metric or a protocol…"></textarea>
      <button class="send" type="submit" id="send">Send</button>
    </form>
  </div>
  <script>
    const thread = document.getElementById("thread");
    const form = document.getElementById("form");
    const queryEl = document.getElementById("query");
    const nctEl = document.getElementById("nct");
    const sendEl = document.getElementById("send");
    const categoryEl = document.getElementById("sample-category");
    const sampleEl = document.getElementById("sample-question");

    const SAMPLE_GROUPS = [
      {
        label: "Site metrics",
        items: [
          { query: "What is the enrollment rate for SITE-001?", nct: "" },
          { query: "How many active trials are at SITE-001?", nct: "" },
          { query: "How many remaining slots does SITE-001 have?", nct: "" },
          { query: "Tell me about SITE-001.", nct: "" },
          { query: "What is the enrollment rate for SITE-007?", nct: "" },
          { query: "How many active trials are at SITE-005?", nct: "" },
          { query: "How many remaining slots does SITE-003 have?", nct: "" },
          { query: "Tell me about SITE-010.", nct: "" },
        ],
      },
      {
        label: "Site ranking",
        items: [
          { query: "Which oncology site has the highest enrollment rate?", nct: "" },
          { query: "Which immunology site has the highest enrollment rate?", nct: "" },
          { query: "Which cardiology site has the highest enrollment rate?", nct: "" },
          { query: "Which site has the highest enrollment rate?", nct: "" },
        ],
      },
      {
        label: "Protocol questions",
        items: [
          { query: "What is the minimum age for NCT04516746?", nct: "" },
          { query: "What are the inclusion criteria for this protocol?", nct: "NCT04516746" },
          { query: "What are the exclusion criteria for this protocol?", nct: "NCT04516746" },
          { query: "What is the maximum age for this protocol?", nct: "NCT04516746" },
          { query: "What conditions does NCT04368728 study?", nct: "" },
          { query: "What is the primary outcome of NCT04470427?", nct: "" },
          { query: "What is the study design of this protocol?", nct: "NCT04156698" },
          { query: "What are the interventions in NCT03875287?", nct: "" },
        ],
      },
      {
        label: "Hybrid recommendations",
        items: [
          { query: "Where should I run my next oncology trial given this protocol?", nct: "NCT04516746" },
          { query: "Recommend sites for this protocol.", nct: "NCT04516746" },
          { query: "Where should I run my next trial given this protocol?", nct: "NCT04368728" },
          { query: "Which sites should I consider for my next oncology trial given this protocol?", nct: "NCT04470427" },
        ],
      },
      {
        label: "Lookalikes (eligibility, not rates)",
        items: [
          { query: "Enrollment criteria at SITE-001", nct: "" },
          { query: "What are the enrollment criteria for this protocol?", nct: "NCT04516746" },
          { query: "What is the eligibility criteria for SITE-001?", nct: "" },
        ],
      },
      {
        label: "Unknown / missing data",
        items: [
          { query: "What is the enrollment rate for site YYY?", nct: "" },
          { query: "What is the enrollment rate for SITE-012?", nct: "" },
          { query: "What is the enrollment rate for SITE-011?", nct: "" },
          { query: "How many remaining slots does SITE-012 have?", nct: "" },
          { query: "How many active trials are at SITE-011?", nct: "" },
          { query: "What is the dosing schedule for NCT00000001?", nct: "" },
        ],
      },
      {
        label: "Incomplete / ambiguous",
        items: [
          { query: "What is the enrollment rate?", nct: "" },
          { query: "What is the minimum age?", nct: "" },
          { query: "Tell me about the protocol.", nct: "" },
          { query: "Where should I run my next trial?", nct: "" },
          { query: "How many remaining slots?", nct: "" },
        ],
      },
      {
        label: "Out of scope",
        items: [
          { query: "Write me a new clinical protocol from scratch", nct: "" },
          { query: "Should I enroll my patient in this trial?", nct: "" },
          { query: "Here is patient John Doe’s chart…", nct: "" },
          { query: "Does this patient meet the eligibility criteria?", nct: "NCT04516746" },
        ],
      },
    ];

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function showEmpty() {
      thread.replaceChildren();
      const box = el("div", "empty");
      box.appendChild(el("h2", "", "Try a query"));
      box.appendChild(el("p", "", "Pick a categorized sample below, or type your own. Each send replaces the previous exchange."));
      thread.appendChild(box);
    }

    function fillSelect(select, placeholder, options) {
      select.replaceChildren(el("option", "", placeholder));
      select.options[0].value = "";
      for (const option of options) {
        const node = el("option", "", option.label);
        node.value = option.value;
        select.appendChild(node);
      }
    }

    function ensureNctOption(nctId) {
      if (!nctId) return;
      if ([...nctEl.options].some((opt) => opt.value === nctId)) return;
      const option = el("option", "", nctId);
      option.value = nctId;
      nctEl.appendChild(option);
    }

    function applySample(item) {
      queryEl.value = item.query;
      ensureNctOption(item.nct);
      nctEl.value = item.nct;
      queryEl.focus();
    }

    function selectedGroup() {
      return SAMPLE_GROUPS[Number(categoryEl.value)] || null;
    }

    function initSamples() {
      fillSelect(
        categoryEl,
        "Select a category…",
        SAMPLE_GROUPS.map((group, index) => ({ value: String(index), label: group.label })),
      );
      fillSelect(sampleEl, "Select a sample…", []);
      sampleEl.disabled = true;

      categoryEl.addEventListener("change", () => {
        const group = selectedGroup();
        if (!group) {
          fillSelect(sampleEl, "Select a sample…", []);
          sampleEl.disabled = true;
          return;
        }
        fillSelect(
          sampleEl,
          "Select a sample…",
          group.items.map((item, index) => ({
            value: String(index),
            label: item.nct ? `${item.query}  ·  ${item.nct}` : item.query,
          })),
        );
        sampleEl.disabled = false;
        sampleEl.focus();
      });

      sampleEl.addEventListener("change", () => {
        const group = selectedGroup();
        const item = group && group.items[Number(sampleEl.value)];
        if (item) applySample(item);
      });
    }

    function formatError(status, body) {
      const detail = body && body.detail;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail)) {
        return detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
      }
      return `Request failed (${status})`;
    }

    function citationLabel(citation) {
      if (citation.site_id) return citation.site_id;
      const parts = [citation.nct_id, citation.section].filter(Boolean);
      return parts.join(" · ") || citation.source;
    }

    function renderAnswer(data) {
      const card = el("div", "msg assistant");
      card.appendChild(el("div", "", data.answer || ""));
      const meta = el("div", "meta");
      meta.appendChild(el("span", `badge route-${data.route || ""}`, `route ${data.route || "?"}`));
      meta.appendChild(el("span", "badge", `source ${data.source || "?"}`));
      for (const citation of data.citations || []) {
        meta.appendChild(el("span", "chip", citationLabel(citation)));
      }
      card.appendChild(meta);
      return card;
    }

    function renderDebug(exchanges) {
      if (!Array.isArray(exchanges) || !exchanges.length) return null;
      const list = el("div", "debug-list");
      exchanges.forEach((exchange, index) => {
        const suffix = exchanges.length > 1 ? ` ${index + 1}` : "";
        list.appendChild(jsonCard(`LLM request${suffix}`, exchange.request));
        list.appendChild(jsonCard(`LLM response${suffix}`, exchange.response));
      });
      return list;
    }

    function jsonCard(title, payload) {
      const text = JSON.stringify(payload ?? {}, null, 2);
      const card = el("div", "debug-card");
      const head = el("div", "debug-head");
      head.appendChild(el("span", "", title));
      const btn = el("button", "copy", "Copy");
      btn.type = "button";
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = "Copied";
        } catch {
          btn.textContent = "Failed";
        }
        setTimeout(() => { btn.textContent = "Copy"; }, 1200);
      });
      head.appendChild(btn);
      card.appendChild(head);
      card.appendChild(el("pre", "", text));
      return card;
    }

    async function loadProtocols() {
      try {
        const response = await fetch("/protocols");
        if (!response.ok) return;
        const items = await response.json();
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.nct_id;
          option.textContent = item.brief_title
            ? `${item.nct_id} — ${item.brief_title}`
            : item.nct_id;
          nctEl.appendChild(option);
        }
      } catch {
        /* dropdown stays at None */
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryEl.value.trim();
      if (!query) return;
      const nctId = nctEl.value;

      thread.replaceChildren();
      const user = el("div", "msg user", query);
      if (nctId) user.appendChild(el("span", "nct", `Attached ${nctId}`));
      thread.appendChild(user);
      const pending = el("div", "msg pending", "Working…");
      thread.appendChild(pending);

      sendEl.disabled = true;
      const payload = { query };
      if (nctId) payload.nct_id = nctId;

      try {
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => ({}));
        pending.remove();
        if (!response.ok) {
          thread.appendChild(el("div", "msg error", formatError(response.status, body)));
          return;
        }
        thread.appendChild(renderAnswer(body));
        const debug = renderDebug(body.llm_debug);
        if (debug) thread.appendChild(debug);
      } catch {
        pending.remove();
        thread.appendChild(el("div", "msg error", "Could not reach the API. Is the server running?"));
      } finally {
        sendEl.disabled = false;
        queryEl.focus();
      }
    });

    queryEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    showEmpty();
    initSamples();
    loadProtocols();
    queryEl.focus();
  </script>
</body>
</html>
