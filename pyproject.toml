[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-site-feasibility"
version = "0.1.0"
description = "Starter scaffold for a Clinical Site Feasibility AI Assistant (interview exercise)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
