[project]
name = "feasibility-practice"
version = "0.1.0"
description = "Practice workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas",
    "duckdb",
    "pytest",
    "httpx",
    "anthropic",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
